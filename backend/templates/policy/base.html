<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DonateBox{% endblock %}</title>
    <style>
        :root {
            --bg: #fafafa;
            --bg-card: #ffffff;
            --border: #e5e7eb;
            --text: #1f2937;
            --text-dim: #6b7280;
            --accent: #7c3aed;
            --accent-light: #ede9fe;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Header */
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-brand {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .header-brand span { color: var(--accent); }
        .header-nav { display: flex; gap: 1.5rem; font-size: 0.875rem; }
        .header-nav a { color: var(--text-dim); }
        .header-nav a:hover { color: var(--accent); text-decoration: none; }
        .header-nav a.active { color: var(--accent); font-weight: 600; }

        /* Content */
        .content {
            max-width: 720px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .content h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .last-updated {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 2rem;
        }
        .content h2 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
            color: var(--text);
        }
        .content p {
            margin-bottom: 1rem;
            color: #374151;
            font-size: 0.95rem;
        }
        .content ul {
            margin-bottom: 1rem;
            padding-left: 1.5rem;
        }
        .content li {
            margin-bottom: 0.4rem;
            color: #374151;
            font-size: 0.95rem;
        }
        .highlight-box {
            background: var(--accent-light);
            border-left: 3px solid var(--accent);
            padding: 1rem 1.25rem;
            border-radius: 0 8px 8px 0;
            margin: 1.5rem 0;
            font-size: 0.9rem;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            font-size: 0.8rem;
            color: var(--text-dim);
            border-top: 1px solid var(--border);
            margin-top: 3rem;
        }

        @media (max-width: 600px) {
            .header { padding: 1rem; flex-direction: column; gap: 0.75rem; }
            .content { padding: 0 1rem; margin: 1.5rem auto; }
            .content h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-brand">
            <span>&#9830;</span> DonateBox
        </div>
        <nav class="header-nav">
            <a href="/policy/privacy" class="{% if 'privacy' in request.url.path %}active{% endif %}">Privacy</a>
            <a href="/policy/terms" class="{% if 'terms' in request.url.path %}active{% endif %}">Terms</a>
            <a href="/policy/refund" class="{% if 'refund' in request.url.path %}active{% endif %}">Refund</a>
        </nav>
    </header>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        &copy; 2024 DonateBox &mdash; {{ recipient }}<br>
        <a href="/policy/privacy">Privacy</a> &middot;
        <a href="/policy/terms">Terms</a> &middot;
        <a href="/policy/refund">Refund Policy</a>
    </footer>
</body>
</html>
