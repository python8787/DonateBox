name: donatebox
description: DonateBox - A simple, premium donation application

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # State Management
  provider: ^6.1.2

  # HTTP
  dio: ^5.7.0

  # Payment Gateways (Phase 4)
  razorpay_flutter: ^1.3.7

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

dependency_overrides:
  path_provider_android: 2.2.12
