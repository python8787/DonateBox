name: donatebox
description: DonateBox - A simple, premium donation application

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # Glassmorphism
  glass_kit: ^4.0.1

  # State Management
  provider: ^6.1.2

  # HTTP
  http: ^1.2.2
  dio: ^5.7.0

  # Payment Gateways
  razorpay_flutter: ^1.3.7
  flutter_stripe: ^11.2.0

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
